# ============================================
# HOSPITAL MANAGEMENT DOCKER COMPOSE
# ============================================
services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: hm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-hospital_managment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - hm-network

  # ============================================
  # NestJS API Service
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-api
    container_name: hm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/hospital_managment}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SYNCHRONIZE: 'true'
      PORT: 8007
    ports:
      - '8007:8007'
    networks:
      - hm-network

  # ============================================
  # React Web App
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-web
    container_name: hm-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - '5173:80'
    networks:
      - hm-network
      - dokploy-network

    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dokploy-network'

      - 'traefik.http.routers.hm-web.rule=Host(`thinkhive.net`)'
      - 'traefik.http.routers.hm-web.entrypoints=websecure'
      - 'traefik.http.routers.hm-web.tls.certresolver=letsencrypt'

      - 'traefik.http.services.hm-web.loadbalancer.server.port=80'

# ============================================
# Networks
# ============================================
networks:
  hm-network:
    driver: bridge
  dokploy-network:
    external: true

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
